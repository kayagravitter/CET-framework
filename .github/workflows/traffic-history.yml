name: Record Repository Traffic Historyon:schedule:- cron: '0 0 * * 0'workflow_dispatch:permissions:contents: writejobs:backup-traffic:runs-on: ubuntu-lateststeps:- name: Checkout Repositoryuses: actions/checkout@v4- name: Create Traffic History Directoryrun: mkdir -p traffic-history- name: Fetch and Merge Traffic Viewsenv:GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}run: |curl -s -H "Authorization: Bearer \(GH_TOKEN" -H "Accept: application/vnd.github+json" "https://github.com\){{ github.repository }}/traffic/views" > current-views.jsonif [ -f traffic-history/views-history.json ]; thencat current-views.json traffic-history/views-history.json > temp.jsonmv temp.json traffic-history/views-history.jsonelsemv current-views.json traffic-history/views-history.jsonfi- name: Fetch and Merge Git Clonesenv:GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}run: |curl -s -H "Authorization: Bearer \(GH_TOKEN" -H "Accept: application/vnd.github+json" "https://github.com\){{ github.repository }}/traffic/clones" > current-clones.jsonif [ -f traffic-history/clones-history.json ]; thencat current-clones.json traffic-history/clones-history.json > temp.jsonmv temp.json traffic-history/clones-history.jsonelsemv current-clones.json traffic-history/clones-history.jsonfi
